packages:
  - apps/*
  - libs/shared/*
  - libs/platform/*/*
  - libs/commerce/*/*
  - libs/restaurant/*/*
engineStrict: true
saveExact: true
strictPeerDependencies: true
enableGlobalVirtualStore: false
storeDir: .pnpm-store
confirmModulesPurge: false
overrides:
  fastify: 5.12.7
  smol-toml: 1.9.1
  ajv@8.17.1: 8.18.0
  axios: 1.21.0
  follow-redirects: 1.16.2
  brace-expansion@5: 5.0.12
  fast-uri@3: 3.1.9
  fast-uri@4: 4.2.3
  minimatch: 11.0.3
allowBuilds:
  nx: true
  esbuild: true
  msgpackr-extract: false
  # Native SQLCipher build for the Edge store (decision E02, 2026-11-02).
  better-sqlite3-multiple-ciphers: true
